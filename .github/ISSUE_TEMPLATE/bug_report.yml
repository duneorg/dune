name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps, a small content/config snippet, or a repository link. The smaller the better.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `deno --version` and `dune --version`, plus your OS."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant terminal output, browser console errors, or `dune doctor` output.
      render: shell
