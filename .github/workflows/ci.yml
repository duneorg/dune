name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege for GITHUB_TOKEN: every job here only checks out and
# runs local checks/builds — none pushes, comments, or otherwise needs
# write access. (Flagged by CodeQL, code-scanning alert #13.)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task test

  # Reproduces the class of bug behind duneorg/dune#2: `dune dev` crashing on
  # a *freshly scaffolded* site because of real npm-cache/registry-resolution
  # issues that only show up outside this repo's own already-warm local
  # cache. Originally chased down with a one-off Docker repro (Ubuntu 24.04 +
  # a pinned Deno version, matching the Dockerfile's own denoland/deno base
  # image) — this job is that repro made permanent, on a clean runner with no
  # pre-warmed npm/JSR cache. Deliberately not a `deno test` case: `dune new`
  # writes a real `jsr:@dune/core@^0.34` import (the published package, not
  # this checkout), so this exercises real network resolution against the
  # registry rather than the fast, offline, local-checkout paths the rest of
  # the suite covers (see live_boot_smoke_test.ts for that narrower, in-repo
  # equivalent).
  #
  # Keep this pin equal to the Dockerfile's FROM tag: `deno run -A src/cli.ts
  # new` here resolves against *this checkout's own* deno.lock (not the
  # scaffolded site's), so an older pinned Deno that predates this repo's
  # lockfile version fails to read it before `dune new` even runs — the same
  # failure `docker build` would hit. Caught live 2026-09-13: the Dockerfile
  # was still pinned to 2.1.4 from when it was added (2026-02-13), but
  # deno.lock had since moved to lockfile v5 (needs Deno >=2.3) — docker build
  # had been silently broken this whole time with no CI coverage to catch it.
  scaffold-smoke-test:
    runs-on: ubuntu-24.04
    # Sum of the per-step budgets below plus headroom for checkout/scaffold.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"

      - name: Scaffold a fresh site with `dune new`
        run: deno run -A src/cli.ts new /tmp/scaffold-smoke-site

      # Split from the boot step below on purpose: on a truly cold DENO_DIR,
      # resolving the scaffolded site's own separate dependency graph (fresh,
      # preact, sharp's native binary, the client-side runtime bundle
      # fetched on first request, ...) is by far the slowest, most
      # network-bound part of this job — timed out live 2026-09-13 even at
      # 10 minutes total. Caching it here, with its own generous budget and
      # its own clear failure mode, means the boot step below only has to
      # measure how long `dune dev` takes to actually bind and answer once
      # its deps already exist locally — a much tighter, more meaningful
      # bound, and a much clearer signal about *which* phase failed.
      - name: Cache the scaffolded site's dependency graph
        working-directory: /tmp/scaffold-smoke-site
        timeout-minutes: 10
        run: deno cache main.ts

      - name: Boot `dune dev` and make a real first request
        working-directory: /tmp/scaffold-smoke-site
        timeout-minutes: 3
        run: |
          set -e
          deno task dev > /tmp/scaffold-smoke-dev.log 2>&1 &
          DEV_PID=$!
          # Stream dune dev's own output live into this step's log — without
          # this, a hang anywhere below produces zero diagnostic output
          # before the step's timeout silently kills the whole process tree.
          tail -F /tmp/scaffold-smoke-dev.log &
          TAIL_PID=$!

          ready=""
          for _ in $(seq 1 60); do
            # --max-time bounds *each* attempt: without it, a connection
            # that's accepted but never answered (the port bound before the
            # handler is actually ready to respond) blocks this one curl
            # call indefinitely instead of retrying — silently burning the
            # entire step budget on a single stuck attempt.
            if curl -sf --max-time 2 http://localhost:3000/ -o /tmp/scaffold-smoke-response.html; then
              ready=1
              break
            fi
            sleep 1
          done

          kill "$TAIL_PID" 2>/dev/null || true
          # No `wait` on $DEV_PID: `deno task dev` runs `deno run --watch`,
          # which spawns a grandchild watcher process — killing the
          # immediate child (what $! actually captures) doesn't guarantee
          # that grandchild's process group actually exits, and `wait`
          # blocks on the immediate child regardless. Confirmed live
          # 2026-09-13: the boot itself succeeded (curl got a real response
          # within ~1s of "Fresh ready"), but the step then hung silently
          # for the rest of its budget on this exact `wait` call. Best-effort
          # kill and move on — the runner's own job cleanup reaps any
          # orphaned deno process afterward regardless (visible as
          # "Terminate orphan process" in a run's Post job cleanup).
          kill "$DEV_PID" 2>/dev/null || true

          if [ -z "$ready" ]; then
            echo "::error::dune dev never served a response from the freshly scaffolded site"
            cat /tmp/scaffold-smoke-dev.log
            exit 1
          fi

          if ! grep -q "Welcome to Your Dune Site" /tmp/scaffold-smoke-response.html; then
            echo "::error::response body did not contain the expected scaffold content"
            cat /tmp/scaffold-smoke-response.html
            exit 1
          fi

  # Deliberately non-blocking: a sibling package's published @dune/core pin
  # can only be re-covered by publishing a new sibling version, which can't
  # happen before this repo's own core bump ships. Every commit to main
  # between "core bump lands" and "all siblings republished" would otherwise
  # show red here for reasons unrelated to that commit — normalizing red CI
  # and burying real failures next to it. Findings still surface as a
  # ::warning:: annotation (see check-core-pin-drift.ts) and as a visible
  # (but non-blocking) status on this job — check it, don't ignore it, but
  # it's a "go republish the siblings" reminder, not a "don't publish this"
  # gate. Contrast plugin-admin's check:core-imports: that one is a
  # same-commit, same-repo consistency check with no publish-timing
  # dependency, so it correctly stays hard-blocking.
  pin-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check:core-pin-drift
